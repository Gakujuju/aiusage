<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo-icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Tints the mobile browser's UI. Matches the manifest's theme_color,
         which is --color-accent from DESIGN.md written as sRGB hex. -->
    <meta name="theme-color" content="#00876e" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No webfonts. Inter came from Google and Geist Mono from jsdelivr, which
      meant two external requests on every load, a typeface that changed once
      they arrived, and — offline, the case the service worker exists for —
      the platform's own fonts anyway. The stacks in --font-sans and --mono
      start from those platform fonts, so the first paint is the final one.
    -->
    <script>
      (function() {
        var pref = localStorage.getItem('aiusage-theme') || 'system';
        var theme = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
